name: iOS · Test & IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build for iPhone
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check project and resources
        run: |
          python3 scripts/generate_project.py --check
          python3 scripts/verify_project.py
          xcodebuild -version
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              devices = json.load(f)['devices']
          phones = [d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d.get('isAvailable') and 'iPhone' in d['name']]
          if not phones:
              raise SystemExit('No available iPhone simulator on this runner')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('udid=' + phones[0]['udid'] + '\n')
          PY
      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test -project OKNative.xcodeproj -scheme OKNative \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee build-tests.log
      - name: Archive unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild archive -project OKNative.xcodeproj -scheme OKNative \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/OKNative.xcarchive -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' | tee build-archive.log
      - name: Package IPA for Sideloadly
        run: bash scripts/package_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: OKNative-unsigned-ipa
          path: build/OKNative-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Capture simulator preview
        continue-on-error: true
        timeout-minutes: 3
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          # Xcode may run tests on a clone. Reuse a booted iOS device when possible.
          xcrun simctl list devices booted --json > "$RUNNER_TEMP/booted.json"
          SIMULATOR_ID="$(python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/booted.json') as f:
              devices = json.load(f)['devices']
          booted = [d['udid'] for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['state'] == 'Booted']
          print(booted[0] if booted else os.environ['SIMULATOR_ID'])
          PY
          )"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/OKNative.app
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" app.erapchu.oknative
          sleep 4
          xcrun simctl io "$SIMULATOR_ID" screenshot build/profile-light.png
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          sleep 2
          xcrun simctl io "$SIMULATOR_ID" screenshot build/profile-dark.png
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iOS-diagnostics
          path: |
            build/Tests.xcresult
            build-tests.log
            build-archive.log
            build/profile-*.png
          retention-days: 7
          if-no-files-found: ignore
